name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - run: ./tool/check.sh
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Realtime is NOT excluded on purpose: the migration alters the supabase_realtime publication.
      - name: Start Supabase (only the services the tests need)
        run: supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
