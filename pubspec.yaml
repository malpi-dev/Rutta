name: rutta
description: "Delivery tracking with the courier's live location on the map."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.1
  go_router: ^17.5.0
  http: ^1.6.0
  intl: any
  json_annotation: ^4.12.0
  latlong2: ^0.10.1
  meta: ^1.18.0
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.2
  wakelock_plus: ^1.8.1

dev_dependencies:
  build_runner: ^2.15.1
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/OFL-Manrope.txt
    - assets/fonts/OFL-Inter.txt
    - assets/icon/splash_logo.png
  fonts:
    - family: Manrope
      fonts:
        - { asset: assets/fonts/Manrope-600.ttf, weight: 600 }
        - { asset: assets/fonts/Manrope-700.ttf, weight: 700 }
        - { asset: assets/fonts/Manrope-800.ttf, weight: 800 }
    - family: Inter
      fonts:
        - { asset: assets/fonts/Inter-400.ttf, weight: 400 }
        - { asset: assets/fonts/Inter-500.ttf, weight: 500 }
        - { asset: assets/fonts/Inter-600.ttf, weight: 600 }

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#FF5A1F"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FF5A1F"
  image: assets/icon/splash_logo.png
  color_dark: "#0F141A"
  image_dark: assets/icon/splash_logo.png
  android_12:
    color: "#FF5A1F"
    image: assets/icon/splash_android12.png
    color_dark: "#0F141A"
    image_dark: assets/icon/splash_android12.png
